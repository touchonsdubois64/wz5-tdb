<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>Touchons du Bois — L'Intégrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-BazZNVnq.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CaztnlMc.css">
</head>
<body>

<div class="app">

  <div class="frame-left" id="frame-left">

  <!-- portrait : un seul titre sur deux lignes ; paysage : « Touchons du bois » au-dessus du cadre de gauche, « L'Intégrale » au-dessus des coups -->
  <h1 class="title only-pt">Touchons du Bois<br>L'Intégrale</h1>
  <h1 class="title only-ls">Touchons du bois</h1>

  <!-- ============ COMMANDES (haut de page) ============ -->
  <section class="controls">

    <!-- Chargement des positions : uniquement via le dossier -->
    <div class="cell-library">
      <div class="library-anchor">
        <button type="button" id="library-btn" class="library-btn" aria-haspopup="true" aria-expanded="false"
                title="Bibliothèque de positions"><img src="./images/library.svg" alt="Bibliothèque de positions"></button>
        <div id="library-menu" class="library-menu" hidden></div>
      </div>
      <div class="library-text">
        <span id="library-title" class="library-title"></span>
        <div id="message" class="message" role="status" aria-live="polite"></div>
        <div id="pgn-message" class="message" role="status" aria-live="polite"></div>
      </div>
    </div>

    <!-- Pendule (trait), Réglages, choix du camp -->
    <div class="cell-modes">
      <div class="clock" data-turn="w" role="group" aria-label="Camp au trait">
        <i class="clock-tab clock-tab-w" aria-hidden="true"></i><i class="clock-tab clock-tab-b" aria-hidden="true"></i>
        <button type="button" id="start-white" class="start-btn white" aria-pressed="false" title="Donner le trait aux Blancs"></button>
        <button type="button" id="start-black" class="start-btn black" aria-pressed="false" title="Donner le trait aux Noirs"></button>
      </div>

      <span class="dotted-sep vsep" aria-hidden="true"></span>

      <div class="settings-anchor">
        <button type="button" id="settings-btn" class="settings-btn" aria-haspopup="true" aria-expanded="false"
                title="Réglages"><img src="./images/settings.svg" alt="Réglages"></button>
        <div id="settings-menu" class="settings-menu" hidden></div>
      </div>

      <button type="button" class="mode-btn m-white" data-mode="white" aria-pressed="false"
              title="Jouer les Blancs contre Stockfish"><img src="./pieces/alpha/wK.svg" alt="Blancs"></button>
      <button type="button" class="mode-btn m-black" data-mode="black" aria-pressed="false"
              title="Jouer les Noirs contre Stockfish"><img src="./pieces/alpha/bK.svg" alt="Noirs"></button>
      <button type="button" class="mode-btn m-both selected" data-mode="analysis" aria-pressed="true"
              title="Mode analyse : jouer les deux camps"><img src="./images/king-bicolor.svg" alt="Mode analyse"></button>
    </div>

  </section>

  <!-- tampons internes (non affichés) : position et PGN en cours de chargement -->
  <input id="fen" type="hidden">
  <input id="pgn" type="hidden">

  <!-- ============ ÉCHIQUIER ET ÉVALUATION ============ -->
  <section class="workspace">

    <div class="left">
      <div class="board-wrapper">
        <div class="rank-labels"></div>
        <div class="board-and-files">
          <div id="board"></div>
          <div id="zone-layer" class="zone-layer" aria-hidden="true"></div>
          <div id="marks-layer" class="marks-layer" aria-hidden="true"></div>
          <div class="file-labels"></div>
        </div>
        <!-- paysage : indicateur du trait à droite de l'échiquier -->
        <div class="turn-indicators" aria-hidden="true"><span id="turn-disc" class="turn-disc"></span><span id="turn-disc-b" class="turn-disc"></span></div>
      </div>

      <div class="navigation">
        <button id="restart" class="nav-square" type="button" title="Recommencer" aria-label="Recommencer"><img src="./images/restart.svg" alt=""></button>
        <button id="first" class="nav-square" type="button" title="Première position" aria-label="Première position"><img src="./images/to_start.svg" alt=""></button>
        <button id="previous" class="nav-square" type="button" title="Coup précédent" aria-label="Coup précédent"><img src="./images/backward.svg" alt=""></button>
        <button id="next" class="nav-square" type="button" title="Coup suivant" aria-label="Coup suivant"><img src="./images/forward.svg" alt=""></button>
        <button id="last" class="nav-square" type="button" title="Dernière position" aria-label="Dernière position"><img src="./images/to_end.svg" alt=""></button>
        <button id="flip" class="nav-square" type="button" title="Retourner l'échiquier" aria-label="Retourner l'échiquier"><img src="./images/flip.svg" alt=""></button>
        <button type="button" id="hint-btn" class="tool-btn" title="Indice : afficher ou masquer les annotations de cette position"><span class="glyph-i">i</span></button>
        <button type="button" id="solution-btn" class="tool-btn" title="Solution : chapitre Lichess commenté"><img class="bulb" src="./images/bulb.svg" alt="Solution"></button>
      </div>

      <!-- le panneau d'annotation n'est plus ouvrable : il reste caché (l'indice utilise la couche d'annotations) -->
      <div id="marks-panel" class="marks-panel" hidden></div>

      <div id="moves" aria-label="Coups, variantes et commentaires"></div>

      <!-- la notation se choisit dans les Réglages (roue dentée) ; cette liste cachée en garde la valeur -->
      <select id="notation" hidden aria-hidden="true" tabindex="-1">
        <option value="french">R D T F C</option>
        <option value="figurines" selected>♔♕♖♗♘</option>
        <option value="international">K Q R B N</option>
      </select>
    </div>

    <aside class="right">
      <div class="eval-row">
        <button id="eval-pill" class="tool-btn eval-btn" type="button" aria-expanded="false" title="Évaluer la position avec Stockfish">
          <span class="pill-glyph"><span class="pill-black"></span><span class="pill-white"></span></span>
        </button>
        <button type="button" id="zone" class="zone-btn" aria-pressed="false"
                title="Winning Zone : cliquez sur une pièce pour colorer les cases selon l'évaluation de la position (vert = gain, jaune = nulle, rose = perte ; au-delà de 7 pièces, évaluation de Stockfish)">
          <span class="z-win">+</span><span class="z-plus">&plusmn;</span><span class="z-draw">=</span><span class="z-loss">&minus;</span>
        </button>
      </div>
      <div id="eval-panel" class="eval-panel" aria-live="polite">
        <div id="eval-head" class="eval-head"></div>
        <div id="eval-moves" class="eval-moves"></div>
      </div>
    </aside>

  </section>

  </div><!-- /frame-left -->

  <!-- cadre de droite (paysage seulement) : titre et liste des coups, rempli par app.js -->
  <div class="frame-right" id="frame-right">
    <h2 class="title title-right only-ls"><span class="t-full">L'Intégrale</span><span class="t-short">TdB - L'Intégrale</span></h2>
  </div>

</div>

<div id="status" class="visually-hidden" aria-live="polite"></div>

<div id="promotion-modal" class="promotion-modal" hidden aria-hidden="true">
  <div class="promotion-box" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
    <div id="promotion-title" class="promotion-title">Choisissez la pièce</div>
    <div id="promotion-choices" class="promotion-choices"></div>
    <button id="promotion-cancel" class="promotion-cancel" type="button">Annuler</button>
  </div>
</div>

</body>
</html>
